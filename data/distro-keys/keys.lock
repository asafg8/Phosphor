  "how_to_verify": {
    "deb": "Use apt with our temporary sources entry 'deb-src [signed-by=<pinned keyring>] <archive> <suite> main' and ALWAYS these options: -o Dir::Etc::sourcelist=<tmp> -o Dir::Etc::sourceparts=- -o Dir::Etc::trustedparts=/nonexistent -o APT::Get::AllowUnauthenticated=false -o Acquire::AllowInsecureRepositories=false -o Acquire::AllowDowngradeToInsecureRepositories=false. The last three are REQUIRED: host apt.conf.d settings apply to our invocation, and with them set to true a wrong-key source was ACCEPTED (2026-10-24). Any NO_PUBKEY / 'not signed' / refused download -> blocked: source-unverified. Never pass --allow-unauthenticated or [trusted=yes]. The .dsc uploader signature (dpkg-source 'failed to verify signature') is optional and NOT the integrity anchor.",
    "rpm": "Download the SRPM directly (no dnf, so dnf.conf gpgcheck/localpkg_gpgcheck never apply). rpm --initdb --dbpath <tmp>; rpm --dbpath <tmp> --import <pinned key>; then rpmkeys --macros=/usr/lib/rpm/macros --define '_pkgverify_level all' --define '_pkgverify_flags 0x0' --checksig --dbpath <tmp> <srpm> must end with exactly 'digests signatures OK'; anything else -> blocked: source-unverified. REQUIRED: host /etc/rpm/macros* (e.g. %_pkgverify_level none, %_pkgverify_flags/%__vsflags 0xffff) make a plain 'rpm -K' print just 'OK' for an empty or wrong keyring (verified 2026-10-24); --macros=/usr/lib/rpm/macros loads no host macro files and the defines force verification."
  },
