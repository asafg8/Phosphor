    # CUSTOM74=1: the second runtime on this host, custom PHP 7.4 fpm, serves /php74/
    location ^~ /php74/ {
        root /var/www;
        index index.php;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php74-fpm.sock;
        }
    }
