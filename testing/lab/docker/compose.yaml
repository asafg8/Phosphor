      phosphor.lab.os: "debian:11"
      phosphor.lab.php.version: "7.4.33"
      phosphor.lab.php.pkg: "7.4.33-1+deb11u12"
      phosphor.lab.php.sapis: "fpm,cli"
      phosphor.lab.php.provenance: "distro"
      phosphor.lab.php.fpm_unit: "php7.4-fpm.service"
      phosphor.lab.init: "systemd"
      phosphor.lab.repo.apt: "stock bullseye sources"
