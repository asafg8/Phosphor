# phosphor local lab. Driven by testing/lab/bin/lab — do not `docker compose up` by hand:
# the helper sets the namespace (PHOSPHOR_LAB_NS → project phosphor-<ns>, containers phosphor-<ns>-<x>, network phosphor-<ns>), the
# per-namespace ports (--env-file .cache/lab/<ns>/compose.env) and the PHOSPHOR_LAB_MEM sizing. Fixture table: fixtures.tsv.
# Profiles = batches: core core-1 core-2 b2 b3 b3a b3b b4 b4a b4b b5 all.
# Labels phosphor.lab.php.* / os / repo_* / pecl / openssl are the fixture's pinned facts: tests read them (lab label <x> <key>)
# instead of hard-coding versions. Product code must never read them (only kind/exposure are inputs).
# VM-like fixture images are built by testing/lab/bin/lab (docker build, tagged phosphor-lab/<x>:v3 and phosphor-lab/<x>:<id8>); each
# namespace pins the content tag it came up with (PHOSPHOR_LAB_IMG_<x>), so a rebuild reaches a namespace only on its next `up`.

x-systemd: &systemd
  privileged: true
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  tmpfs:
    - /run
    - /run/lock
  stop_signal: SIGRTMIN+3
  stop_grace_period: 10s
  networks: [lab]
  extra_hosts: ["host.docker.internal:host-gateway"]

x-php-health: &php-health
  test: ["CMD-SHELL", "curl -fsS -A phosphor-lab-health http://localhost/_phosphor_lab/version >/dev/null"]
  interval: 3s
  timeout: 5s
  retries: 100
  start_period: 10s

networks:
  lab:
    name: phosphor-${PHOSPHOR_LAB_NS:?run via testing/lab/bin/lab}


services:
  loadgen:
    build: {context: loadgen}
    image: phosphor-lab/loadgen:v3
    container_name: phosphor-${PHOSPHOR_LAB_NS}-loadgen
    volumes: ["./loadgen/targets.json:/etc/loadgen/targets.json:ro"]
    ports: ["${PHOSPHOR_LAB_LOADGEN_PORT}:8099"]
    networks: [lab]
    mem_limit: ${PHOSPHOR_LAB_INFRA_MEM}
    labels: {phosphor.lab.ns: "${PHOSPHOR_LAB_NS}", phosphor.lab.infra: loadgen}

  n:
    <<: *systemd
    pull_policy: never
    image: ${PHOSPHOR_LAB_IMG_n:-phosphor-lab/n:v3}
    container_name: phosphor-${PHOSPHOR_LAB_NS}-n
    hostname: phosphor-${PHOSPHOR_LAB_NS}-n
    profiles: [core, core-1, all]
    ports: ["${PHOSPHOR_LAB_PORT_n}:80"]
    mem_limit: ${PHOSPHOR_LAB_N_MEM}
    memswap_limit: ${PHOSPHOR_LAB_N_MEM}
    cpus: ${PHOSPHOR_LAB_CPUS}
    labels:
      phosphor.lab.ns: "${PHOSPHOR_LAB_NS}"
      phosphor.lab.fx: "n"
      phosphor.lab.kind: "vm"
      phosphor.lab.exposure: "internal"
      phosphor.lab.emulates: "nginx static site, no PHP (false positive)"
      phosphor.lab.os: "debian:12"
      phosphor.lab.php.version: "none"
      phosphor.lab.init: "systemd"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null"]
      interval: 3s
      retries: 60


  d12:
    # Debian 12 + Debian's packaged php8.2-fpm/cli 8.2.32-1~deb12u1 (bookworm main), mirroring the Moodle EC2.
    # No image of its own: runs (n)'s Debian 12 image; testing/lab/bin/lab provisions PHP at `up`/`fixture-reset` from bookworm.
    <<: *systemd
    pull_policy: never
    image: ${PHOSPHOR_LAB_IMG_n:-phosphor-lab/n:v3}
    container_name: phosphor-${PHOSPHOR_LAB_NS}-d12
    hostname: phosphor-${PHOSPHOR_LAB_NS}-d12
    profiles: [b4, b4b, all]
    ports: ["${PHOSPHOR_LAB_PORT_d12}:80"]
    mem_limit: ${PHOSPHOR_LAB_DISTRO_BUILD_MEM}
    memswap_limit: ${PHOSPHOR_LAB_DISTRO_BUILD_MEM}
    cpus: ${PHOSPHOR_LAB_BUILD_CPUS}
    labels:
      phosphor.lab.ns: "${PHOSPHOR_LAB_NS}"
      phosphor.lab.fx: "d12"
      phosphor.lab.kind: "vm"
      phosphor.lab.exposure: "internal"
      phosphor.lab.emulates: "Debian 12 + packaged php8.2-fpm/cli 8.2.32 (Moodle-style EC2), no sqlite, pdo shared"
      phosphor.lab.os: "debian:12"
      phosphor.lab.php.version: "8.2.32"
      phosphor.lab.php.pkg: "8.2.32-1~deb12u1"
      phosphor.lab.php.sapis: "fpm,cli"
      phosphor.lab.php.provenance: "distro"
      phosphor.lab.php.fpm_unit: "php8.2-fpm.service"
      phosphor.lab.repo.fixed: "8.2.35-1~deb12u1 (bookworm-security)"
      phosphor.lab.init: "systemd"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -A phosphor-lab-health http://localhost/ >/dev/null"]
      interval: 3s
      retries: 100

  a:
    <<: *systemd
    pull_policy: never
    image: ${PHOSPHOR_LAB_IMG_a:-phosphor-lab/a:v3}
    container_name: phosphor-${PHOSPHOR_LAB_NS}-a
    hostname: phosphor-${PHOSPHOR_LAB_NS}-a
    profiles: [core, core-1, b4, b4b, all]
