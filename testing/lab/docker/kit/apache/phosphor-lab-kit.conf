# phosphor-lab kit routes (regex alias: not a code root).
# docker healthcheck requests are not access-logged (CustomLog … env=!phosphor_nolog)
SetEnvIf User-Agent "^phosphor-lab-health$" phosphor_nolog
AliasMatch ^/_phosphor_lab/ /usr/local/lib/phosphor-lab-kit/kit.php
<Directory /usr/local/lib/phosphor-lab-kit>
    Require all granted
</Directory>
