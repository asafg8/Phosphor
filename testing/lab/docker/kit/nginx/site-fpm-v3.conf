# phosphor-lab nginx → php-fpm site. __SOCK__ is replaced at image build.
server {
    listen 80 default_server;
    root __ROOT__;
    index index.php;
    client_max_body_size 64m;
    access_log /var/log/nginx/access.log combined if=$phosphor_log;
    error_log /var/log/nginx/error.log;

    location ^~ /_phosphor_lab/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/local/lib/phosphor-lab-kit/kit.php;
        fastcgi_pass __SOCK__;
    }
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass __SOCK__;
    }
}
