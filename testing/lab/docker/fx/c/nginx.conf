server {
    listen 80 default_server;
    root /var/www/legacy;
    index index.php;
    access_log /var/log/nginx/access.log combined if=$phosphor_log;
    error_log /var/log/nginx/error.log;
    location ^~ /_phosphor_lab/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/local/lib/phosphor-lab-kit/kit.php;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}
